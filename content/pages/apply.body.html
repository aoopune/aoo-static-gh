<main id="hl-apply" class="hl-apply hl-apply--review">
    <div class="hl-apply-inner">
      <h1 class="hl-apply-title">{{SW:t.review_your_application.1}}</h1>

      <div class="hl-apply-review-actions">
        <a class="hl-apply-review-back" href="explore-banks.html">
          <svg class="hl-apply-review-back-arrow" viewBox="0 0 10 10" aria-hidden="true" focusable="false">
            <path d="M7.8 1.2 3.2 5 7.8 8.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>{{SW:t.back.2}}</span>
        </a>
        <button type="button" class="hl-apply-cta" id="hl-continue-application" disabled>
          <span class="hl-apply-cta-label">{{SW:t.continue.3}}</span>
        </button>
      </div>

      <div class="hl-apply-layout hl-apply-layout--review">
        <div class="hl-apply-main">
          <section class="hl-apply-context" aria-labelledby="hl-apply-context-heading">
            <h2 id="hl-apply-context-heading" class="hl-apply-section-title">{{SW:t.details_you_entered.4}}</h2>
            <div id="hl-apply-primary-details" class="hl-apply-facts--primary"></div>
            <button
              type="button"
              class="hl-apply-disclose"
              id="hl-apply-details-toggle"
              aria-expanded="false"
              aria-controls="hl-apply-your-details-panel"
            >
              <span class="hl-apply-disclose-label">{{SW:t.show_more_details.5}}</span>
              <svg class="hl-apply-disclose-arrow" viewBox="0 0 10 10" aria-hidden="true" focusable="false">
                <path d="M2.2 1.2 6.8 5 2.2 8.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div
              class="hl-apply-disclose-panel"
              id="hl-apply-your-details-panel"
              aria-hidden="true"
            >
              <div class="hl-apply-disclose-panel-inner">
                <dl id="hl-apply-your-details" class="hl-apply-facts"></dl>
              </div>
            </div>
          </section>

          <section class="hl-apply-bag" aria-labelledby="hl-apply-bag-heading">
            <div class="hl-apply-bag-head">
              <h2 id="hl-apply-bag-heading" class="hl-apply-section-title">{{SW:t.banks_you_chose.6}}</h2>
              <p class="hl-apply-bag-meta"><span id="hl-apply-n">0</span> <span id="hl-apply-n-noun">{{SW:t.banks.7}}</span></p>
            </div>
            <ul id="hl-apply-banks" class="hl-apply-banks" aria-label="{{SW:t.selected_banks.0}}"></ul>
          </section>
        </div>
      </div>

    </div>
  </main>
