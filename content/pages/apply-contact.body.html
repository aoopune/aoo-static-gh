<main id="hl-apply" class="hl-apply hl-apply--contact">
    <div class="hl-apply-inner">
      <header class="hl-apply-contact-header">
        <div class="hl-apply-contact-head">
          <h1 class="hl-apply-title">{{SW:t.your_contact_details.5}}</h1>
          <p class="hl-apply-recap" id="hl-apply-recap">{{SW:t.applying_to.21}}<span id="hl-apply-recap-n">0</span> <span id="hl-apply-recap-noun">{{SW:t.banks.6}}</span>.
          </p>
        </div>
        <p class="hl-apply-purpose">{{SW:t.we_use_this_email_and_number_for_updates_and_the.7}}</p>
      </header>

      <form id="hl-apply-form" class="hl-apply-form" novalidate>
        <div class="hl-apply-fields">
          <div class="hl-apply-field hl-apply-field--name">
            <label for="hl-name">{{SW:t.full_name.8}}</label>
            <div class="hl-apply-field-row">
              <input id="hl-name" name="name" type="text" autocomplete="name" required placeholder="{{SW:t.as_on_your_id.0}}">
            </div>
          </div>
          <div class="hl-apply-field hl-apply-field--phone">
            <label for="hl-phone">{{SW:t.phone.9}}</label>
            <div class="hl-apply-field-row hl-apply-phone-row">
              <span class="hl-apply-phone-prefix" title="{{SW:t.india.1}}">
                <svg class="hl-apply-phone-flag" viewBox="0 0 24 16" focusable="false" aria-hidden="true">
                  <rect width="24" height="5.333" y="0" fill="#FF9933"/>
                  <rect width="24" height="5.334" y="5.333" fill="#FFFFFF"/>
                  <rect width="24" height="5.333" y="10.667" fill="#138808"/>
                  <circle cx="12" cy="8" r="1.65" fill="none" stroke="#000080" stroke-width="0.55"/>
                </svg>
                <span class="hl-apply-phone-cc">{{SW:t.91.10}}</span>
              </span>
              <input
                id="hl-phone"
                name="phone"
                type="tel"
                inputmode="numeric"
                autocomplete="tel-national"
                required
                maxlength="18"
                placeholder="{{SW:t.xxxxx_xxxxx.2}}"
                aria-label="{{SW:t.indian_mobile_number_91.3}}"
              >
              <span class="hl-apply-phone-ok" id="hl-phone-ok" hidden>
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                  <path d="M3.2 8.2 6.4 11.4 12.8 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="visually-hidden">{{SW:t.valid_mobile_number.11}}</span>
              </span>
            </div>
          </div>
          <div class="hl-apply-field hl-apply-field--email">
            <label for="hl-email">{{SW:t.email.12}}</label>
            <div class="hl-apply-field-row hl-apply-email-row">
              <input id="hl-email" name="email" type="email" autocomplete="email" required placeholder="{{SW:t.name_example_com.4}}">
              <button type="button" class="hl-apply-text-action hl-apply-verify" id="hl-verify-email" disabled>{{SW:t.verify.13}}</button>
            </div>
            <p class="hl-apply-verify-status" id="hl-verify-status" hidden>{{SW:t.email_verified.14}}</p>
            <p class="hl-apply-email-mismatch" id="hl-email-mismatch" hidden></p>
          </div>
        </div>
      </form>

      <div class="hl-apply-contact-footer">
        <div class="hl-apply-commit">
          <label class="hl-apply-consent" for="hl-consent">
            <input type="checkbox" id="hl-consent" name="consent" required>
            <span class="hl-apply-consent-copy">
              <span class="hl-apply-consent-line">{{SW:t.i_confirm_that_the_information_i_provide_here_is.15}}</span>
              <span class="hl-apply-consent-line">{{SW:t.i_agree_that_shroffin_may_email_or_call_me_about.16}}</span>
              <span class="hl-apply-consent-line">{{SW:t.see.22}}<a href="/privacy-policy.html">{{SW:t.privacy_policy.17}}</a>{{SW:t.and.23}}<a href="/terms-of-use.html">{{SW:t.terms_of_use.18}}</a>.</span>
            </span>
          </label>
        </div>

        <div class="hl-apply-actions">
          <a class="hl-apply-review-back" href="apply.html">
            <svg class="hl-apply-review-back-arrow" viewBox="0 0 10 10" aria-hidden="true" focusable="false">
              <path d="M7.8 1.2 3.2 5 7.8 8.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>{{SW:t.back.19}}</span>
          </a>
          <button type="button" class="hl-apply-cta" id="hl-submit-application" disabled>
            <span class="hl-apply-cta-label">{{SW:t.submit_application.20}}</span>
            <span class="hl-apply-cta-spinner" aria-hidden="true" hidden></span>
          </button>
        </div>
      </div>
    </div>
  </main>
