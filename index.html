<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Apply Only Once – Education loan comparison</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <style>
    /* Homepage: body locked to viewport height; table iframe fills remaining space and scrolls internally */
    body.home-locked {
      height: 100vh;
      overflow: hidden;
    }

    .home-locked .home-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      padding-top: var(--space-3);
      padding-bottom: var(--space-3);
    }

    .home-locked .home-table-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: var(--space-3);
    }

    .home-locked .home-table-section iframe.loan-table-embed {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body class="home-locked">
  <header class="site-header" id="site-header"></header>
  <main class="home-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
          <h1 class="home-heading">Let 35+ Lenders Compete for Your Education Loan</h1>

          <p class="home-subheading">Compare & Apply with one application to all</p>

          <p class="home-course-types">Save 40+ hours of branch visits, repeated paperwork and get the lowest interest rates.</p>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <!-- Table section full-width so embedded table matches standalone UI (filters + table) -->
        </div>
      </div>
    </div>
    <section class="home-table-section" aria-label="Loan comparison">
      <iframe class="loan-table-embed" src="table-embed.html" title="Education loan comparison table"></iframe>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/app.js"></script>
</body>
</html>
