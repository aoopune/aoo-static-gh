<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Apply Only Once – Education loan comparison</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <style>
    /* Homepage: body locked to viewport height; table iframe fills remaining space and scrolls internally */
    body.home-locked {
      height: 100vh;
      overflow: hidden;
    }

    .home-locked .home-main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      padding-top: var(--space-1);
      padding-bottom: var(--space-1);
    }

    .home-locked .home-table-section {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: var(--space-1);
    }

    .home-locked .home-table-section iframe.loan-table-embed {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body class="home-locked">
  <header class="site-header" id="site-header"></header>
  <main class="home-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
          <h1 class="home-heading">Let 35+ Lenders Compete for Your Lowest Education Loan Rate</h1>

          <p class="hero-subheading">Compare, select & apply with one application • ₹99 flat fee • 48hr reply or refund</p>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <!-- Table section full-width so embedded table matches standalone UI (filters + table) -->
        </div>
      </div>
    </div>
    <section class="home-table-section" aria-label="Loan comparison">
      <iframe class="loan-table-embed" src="table-embed.html" title="Education loan comparison table"></iframe>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (function () {
      var SUPABASE_URL = 'https://hyvpuivgexbxxiluxryx.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5dnB1aXZnZXhieHhpbHV4cnl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MjQwNjgsImV4cCI6MjA4NzUwMDA2OH0.bEoMNHn138BH4j9-iZp8ZKVRFjKoC856J7lKH6d12uA';
      try {
        var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        var loc = typeof window !== 'undefined' && window.location ? window.location : { search: '', hash: '' };
        var code = null;
        if (loc.search) {
          var q = loc.search.slice(1).split('&');
          for (var i = 0; i < q.length; i++) {
            var parts = q[i].split('=');
            if (parts[0] === 'code' && parts[1]) { code = decodeURIComponent(parts[1]); break; }
          }
        }
        if (!code && loc.hash && loc.hash.indexOf('access_token=') !== -1) {
          var params = {};
          loc.hash.slice(1).split('&').forEach(function (p) {
            var parts = p.split('=');
            if (parts.length >= 2) params[decodeURIComponent(parts[0])] = decodeURIComponent(parts.slice(1).join('=').replace(/\+/g, ' '));
          });
          if (params.access_token) {
            client.auth.setSession({ access_token: params.access_token, refresh_token: params.refresh_token || '' })
              .then(function () { if (window.history && window.history.replaceState) window.history.replaceState(null, '', window.location.pathname + window.location.search); })
              .catch(function () {});
          }
        } else if (code && client.auth.exchangeCodeForSession) {
          client.auth.exchangeCodeForSession(code).then(function () {
            if (window.history && window.history.replaceState) {
              var search = (window.location.search || '').replace(/\bcode=[^&]*&?/gi, '').replace(/^&|&$/g, '');
              var clean = window.location.pathname + (search ? '?' + search : '') + (window.location.hash || '');
              window.history.replaceState(null, '', clean);
            }
          }).catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
