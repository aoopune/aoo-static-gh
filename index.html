<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply Only Once</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, #fff 0%, #fbfbfd 42%, #f5f5f7 100%);
      color: #1d1d1f;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }

    .home-content {
      --section-gap: clamp(96px, 15dvh, 190px);
      height: 100svh;
      height: 100dvh;
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto auto auto;
      align-content: center;
      justify-items: center;
      gap: var(--section-gap);
      padding: clamp(76px, 10dvh, 112px) clamp(20px, 6vw, 48px) clamp(62px, 8dvh, 88px);
      text-align: center;
    }

    .site-logo {
      position: fixed;
      top: 28px;
      left: 32px;
      color: #1d1d1f;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.055em;
    }

    .hero-copy,
    .mission-copy {
      max-width: 980px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(58px, 8.4vw, 92px);
      font-weight: 600;
      line-height: 0.94;
      letter-spacing: -0.07em;
    }

    .hero-subtitle {
      margin: 8px 0 0;
      color: #1d1d1f;
      font-size: clamp(26px, 3.6vw, 38px);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    .mission-label {
      margin: 0 0 10px;
      color: rgba(29, 29, 31, 0.68);
      font-size: clamp(12px, 1.25vw, 14px);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.08em;
    }

    .mission-text {
      margin: 0;
      font-size: clamp(24px, 3.1vw, 32px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.052em;
      text-wrap: balance;
    }

    .mission-text strong {
      font-weight: 600;
    }

    .mission-break {
      display: block;
    }

    .mobile-mission-break {
      display: none;
    }

    .mission-last-line {
      white-space: nowrap;
    }

    .contact-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contact-prompt {
      margin: 0 0 12px;
      color: #1d1d1f;
      font-size: clamp(15px, 1.5625vw, 18px);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .contact-line {
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .contact-phone,
    .contact-whatsapp {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 22px;
      border-radius: 980px;
      font-size: 17px;
      line-height: 1.1764705882;
      font-weight: 400;
      letter-spacing: -0.022em;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .contact-phone {
      background: #0071e3;
      color: #fff;
      border: none;
    }

    .contact-phone:hover {
      background: #0077ed;
    }

    .contact-whatsapp {
      background: transparent;
      color: #0071e3;
      border: 1px solid #0071e3;
    }

    .contact-whatsapp:hover {
      background: rgba(0, 113, 227, 0.06);
    }

    .contact-phone:active,
    .contact-whatsapp:active {
      opacity: 0.82;
    }

    .contact-phone:focus-visible,
    .contact-whatsapp:focus-visible {
      outline: 2px solid #0071e3;
      outline-offset: 3px;
    }

    .education-loan-button {
      position: fixed;
      left: 28px;
      bottom: 24px;
      padding: 8px 14px;
      border: 1px solid #1d1d1f;
      border-radius: 999px;
      background: transparent;
      color: #1d1d1f;
      font-size: 13px;
      line-height: 1.15;
      text-decoration: none;
      transition: background 160ms ease, color 160ms ease;
    }

    .education-loan-button:hover {
      background: #1d1d1f;
      color: #fff;
    }

    .education-loan-button:focus-visible {
      outline: 2px solid #111827;
      outline-offset: 3px;
    }

    @media (max-width: 640px) {
      .home-content {
        grid-template-rows: repeat(3, 1fr);
        align-content: stretch;
        align-items: center;
        gap: 0;
        padding: 76px 22px 52px;
      }

      .site-logo {
        top: 28px;
        left: 50%;
        font-size: 28px;
        transform: translateX(-50%);
      }

      .hero-title {
        font-size: clamp(48px, 14vw, 72px);
        line-height: 0.95;
      }

      .hero-subtitle {
        margin-top: 6px;
        font-size: clamp(23px, 7vw, 32px);
        line-height: 1.02;
      }

      .mission-text {
        font-size: clamp(21px, 6vw, 28px);
        line-height: 1.04;
        text-wrap: wrap;
      }

      .mission-label {
        font-size: clamp(12px, 3.2vw, 14px);
      }

      .contact-prompt {
        font-size: clamp(15px, 4vw, 18px);
      }

      .mission-copy {
        max-width: 100%;
        width: 100%;
        padding: 0 4px;
        box-sizing: border-box;
      }

      .mission-last-line {
        display: inline-block;
        max-width: 100%;
        font-size: clamp(17px, 4.6vw, 21px);
        letter-spacing: -0.045em;
      }

      .mission-break {
        display: block;
      }

      .mobile-mission-break {
        display: block;
      }

      .contact-line {
        flex-direction: row;
        flex-wrap: nowrap;
        gap: 10px;
      }

      .education-loan-button {
        left: 16px;
        bottom: 14px;
        padding: 7px 12px;
        font-size: 12px;
      }

    }

    @media (max-width: 640px) and (max-height: 720px) {
      .home-content {
        padding-top: 64px;
        padding-bottom: 42px;
      }

      .site-logo {
        top: 22px;
        font-size: 24px;
      }

      .hero-title {
        font-size: clamp(42px, 13vw, 56px);
      }

      .hero-subtitle {
        font-size: clamp(21px, 6.4vw, 26px);
      }

      .mission-text {
        font-size: clamp(19px, 5.6vw, 23px);
      }

      .mission-label {
        font-size: 11px;
      }

      .contact-prompt {
        font-size: 14px;
      }

    }

    @media (max-height: 520px) {
      .home-content {
        padding-top: 52px;
        padding-bottom: 34px;
      }

      .site-logo {
        top: 16px;
        font-size: 22px;
      }

      .hero-title {
        font-size: clamp(38px, 10vw, 54px);
      }

      .hero-subtitle {
        font-size: clamp(18px, 5vw, 24px);
      }

      .mission-text {
        font-size: clamp(17px, 4.4vw, 22px);
      }

      .mission-label {
        font-size: 10px;
      }

      .contact-prompt {
        font-size: 13px;
      }

      .education-loan-button {
        bottom: 10px;
        padding: 8px 11px;
      }

    }
  </style>
</head>
<body>
  <div class="site-logo">ApplyOnlyOnce</div>
  <main class="home-content">
    <section class="hero-copy" aria-labelledby="home-loan-title">
      <h1 class="hero-title" id="home-loan-title">Home Loan</h1>
      <p class="hero-subtitle">Unbiased help. No fees.</p>
    </section>
    <section class="mission-copy" aria-label="Our Mission">
      <p class="mission-label">OUR MISSION</p>
      <p class="mission-text"><strong>Save every single rupee</strong> <br class="mobile-mission-break">in your home loan journey,<br class="mission-break"><span class="mission-last-line">Across interest, bank charges &amp; EMIs</span></p>
    </section>
    <section class="contact-copy" aria-label="Contact">
      <p class="contact-prompt">New loan or paying a loan? Ask me anything.</p>
      <p class="contact-line">
        <a class="contact-phone" href="tel:+919112334367">Call Yash</a>
        <a class="contact-whatsapp" href="https://wa.me/919112334367?text=Hi" target="_blank" rel="noopener">WhatsApp Yash</a>
      </p>
    </section>
  </main>
  <a class="education-loan-button" href="education-loan.html">Education Loan</a>
</body>
</html>
