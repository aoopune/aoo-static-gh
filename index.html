  <title>Apply Only Once – Education loan comparison</title>
  <!-- Critical: above-the-fold layout and typography (non-blocking) -->
  <style>
    :root { --space-1: 0.25rem; --text: #0f172a; --bg-nav: rgba(255,255,255,0.92); --nav-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04); }
    html:has(body.home-locked) { height: 100%; }
    body.home-locked {
      height: 100%; margin: 0; overflow: hidden;
      display: flex; flex-direction: column; min-height: 0;
      font-family: 'Montserrat', sans-serif;
    }
    .home-locked .site-header {
      flex-shrink: 0;
      width: fit-content;
      max-width: 95%;
      margin: 24px auto 0 auto;
      padding: 10px 24px;
      min-height: 44px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      border-radius: 999px;
      background: var(--bg-nav);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }
    .home-locked .home-main {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column;
      padding-top: 13px; padding-bottom: var(--space-1);
    }
    .home-locked .home-main .container { flex-shrink: 0; width: 100%; max-width: none; padding-left: 0; padding-right: 0; }
    .home-locked .home-main .row { display: flex; flex-wrap: wrap; margin-left: -0.5rem; margin-right: -0.5rem; }
    .home-locked .home-main .col-12 { flex: 0 0 100%; max-width: 100%; padding: 0 0.5rem; }
    .home-locked .home-main .justify-content-center { justify-content: center; }
    .home-heading {
      margin: 0 0 var(--space-1);
      font-size: clamp(1.35rem, 2.85vw, 2rem); font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.2; color: var(--text);
      white-space: nowrap;
    }
    .hero-line2 { display: inline; }
    .hero-pipe { display: inline; }
    .hero-subheading {
      font-size: 18px; font-weight: 600; margin: 12px auto 0;
      color: #475569; text-align: center; line-height: 1.5; max-width: 90vw;
    }
    .home-locked .home-table-section {
      flex: 1; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column; margin-top: 6px;
    }
    .home-locked .home-table-section iframe.loan-table-embed {
      display: block; width: 100%; height: 100%; min-height: 0;
      border: none; background: transparent;
    }
  </style>
  <!-- Bootstrap first, then our styles (so Montserrat overrides Bootstrap font) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css?v=4" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" media="print" onload="this.media='all'">
