<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" preserveAspectRatio="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#8a141c"/>
      <stop offset="12%" stop-color="#d32f2f"/>
      <stop offset="28%" stop-color="#ef5350"/>
      <stop offset="42%" stop-color="#ff8a00"/>
      <stop offset="52%" stop-color="#ffca28"/>
