<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Product demo preview – Shroffin</title>
  <link rel="preload" href="../fonts/GoogleSansFlex/GoogleSansFlex_72pt-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="../fonts/GoogleSansFlex/GoogleSansFlex_72pt-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="../fonts/GoogleSansFlex/GoogleSansFlex_72pt-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../css/shroffin-shell.css?v=type-ladder-5">
  <link rel="stylesheet" href="../css/shroffin-product-demo.css?v=77">
  <style>
    body { margin: 0; background: var(--shroffin-surface, #fcfcfd); }
    .preview-banner {
      background: #1d1d1f;
      color: #f5f5f7;
      text-align: center;
      font-size: 0.8125rem;
      padding: 0.65rem 1rem;
      font-family: "Google Sans Flex", sans-serif;
    }
    .preview-banner a { color: #7eb6ff; }
  </style>
</head>
<body>
  <p class="preview-banner">
    <strong>Preview only</strong> — Mac window · full flow.
    <a href="_product-demo-mobile-preview.html">Mobile iPhone preview</a>
  </p>

  <section class="spd-section" data-spd-preview aria-labelledby="spd-heading">
    <div class="spd-section-inner">
      <p class="spd-eyebrow">The product</p>
      <h2 class="spd-heading" id="spd-heading">Every bank. One standardized view.</h2>
      <p class="spd-lede">Your details in, options out — then filters, other charges, pick banks, apply once.</p>

      <div class="spd-sr-only">
        Animated demonstration of Explore banks. Open Explore banks for the live tool.
      </div>

      <div class="spd-stage" data-spd-stage>
        <div class="spd-stage-scaler">
          <div class="spd-window-slot" data-spd-slot>
            <div class="spd-window" data-spd-window>
              <div class="spd-titlebar">
                <div class="spd-traffic" aria-hidden="true"><span></span><span></span><span></span></div>
                <div class="spd-titlebar-label">Explore banks</div>
              </div>
              <iframe
                class="spd-frame"
                data-spd-frame
                title="Explore banks product demo"
                src="_product-demo-frame.html?v=56"
                width="1640"
                height="728"
                loading="eager"
                tabindex="-1"
              ></iframe>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="../js/shroffin-product-demo-chrome.js?v=78"></script>
</body>
</html>
