<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Product demo mobile preview – Shroffin</title>
  <link rel="preload" href="../fonts/GoogleSansFlex/GoogleSansFlex_72pt-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="../fonts/GoogleSansFlex/GoogleSansFlex_72pt-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="../fonts/GoogleSansFlex/GoogleSansFlex_72pt-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../css/shroffin-shell.css?v=type-ladder-5">
  <link rel="stylesheet" href="../css/shroffin-product-demo.css?v=77">
  <style>
    body { margin: 0; background: var(--shroffin-surface, #fcfcfd); }
    .preview-banner {
      background: #1d1d1f;
      color: #f5f5f7;
      text-align: center;
      font-size: 0.8125rem;
      padding: 0.65rem 1rem;
      font-family: "Google Sans Flex", sans-serif;
    }
    .preview-banner a { color: #7eb6ff; }
  </style>
</head>
<body>
  <p class="preview-banner">
    <strong>Mobile preview only</strong> — iPhone · Filters popover · Apply dock.
    <a href="_product-demo-preview.html">Desktop Mac preview</a>
  </p>

  <section class="spd-section spd-section--phone" aria-label="Mobile Explore banks demo">
    <div class="spd-section-inner">
      <div class="spd-sr-only">
        Animated phone demonstration of Explore banks. Open Explore banks for the live tool.
      </div>
      <div class="spd-stage spd-stage--phone" data-spd-stage data-spd-device="phone">
        <div class="spd-stage-scaler">
          <div class="spd-phone" data-spd-phone>
            <div class="spd-phone-btn spd-phone-btn--silent" aria-hidden="true"></div>
            <div class="spd-phone-btn spd-phone-btn--vol-up" aria-hidden="true"></div>
            <div class="spd-phone-btn spd-phone-btn--vol-down" aria-hidden="true"></div>
            <div class="spd-phone-btn spd-phone-btn--power" aria-hidden="true"></div>
            <div class="spd-phone-screen">
              <div class="spd-phone-statusbar" aria-hidden="true">
                <span class="spd-phone-time">9:41</span>
                <span class="spd-phone-status-icons">
                  <span class="spd-phone-signal"></span>
                  <span class="spd-phone-wifi"></span>
                  <span class="spd-phone-battery"></span>
                </span>
              </div>
              <div class="spd-phone-island" aria-hidden="true"></div>
              <iframe
                class="spd-phone-frame"
                title="Explore banks mobile demo"
                src="_product-demo-frame-mobile.html?v=15"
                width="390"
                height="844"
                loading="eager"
                tabindex="-1"
              ></iframe>
              <div class="spd-phone-home" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="../js/shroffin-product-demo-chrome.js?v=78"></script>
</body>
</html>
