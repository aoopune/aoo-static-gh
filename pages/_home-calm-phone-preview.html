<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calm phone preview — Shroffin</title>
  <link rel="stylesheet" href="/css/shroffin-home-calm-phone.css?v=25">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #1a1a1a;
      font-family: "Google Sans Flex", -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .preview {
      box-sizing: border-box;
      width: min(1240px, calc(100% - 48px));
      height: min(620px, calc(100svh - 48px));
      margin: 24px auto;
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
      border-radius: 16px;
      overflow: hidden;
      background: #0a0a0a;
    }
    .preview-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 1.2rem;
      line-height: 1.4;
    }
    .preview-copy strong {
      display: block;
      margin-bottom: 12px;
      color: #f5f5f7;
      font-size: 1.75rem;
      font-weight: 500;
      letter-spacing: -0.035em;
    }
    @media (max-width: 833px) {
      .preview {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
        height: min(720px, calc(100svh - 32px));
      }
      .preview-copy {
        padding: 24px 16px 12px;
        text-align: center;
        font-size: 1rem;
      }
      .preview-copy strong {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="preview">
    <div class="preview-copy">
      <strong>Best of all, no noise from us.</strong>
      Only to help you, or<br>
      to share an update.<br>
      That’s it.
    </div>
    <div class="home-feature-visual home-calm-phone" aria-hidden="true" data-home-calm-phone data-force-motion>
      <div class="hcp-stage">
        <div class="hcp-device">
          <span class="hcp-btn hcp-btn--silent"></span>
          <span class="hcp-btn hcp-btn--vol-up"></span>
          <span class="hcp-btn hcp-btn--vol-down"></span>
          <span class="hcp-btn hcp-btn--power"></span>
          <div class="hcp-bezel">
            <div class="hcp-screen">
              <div class="hcp-wallpaper"></div>
              <div class="hcp-island"></div>
              <div class="hcp-status">
                <span class="hcp-time">9:41</span>
                <span class="hcp-status-icons">
                  <svg class="hcp-signal-svg" viewBox="0 0 17 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="0.6"/><rect x="4.5" y="5.5" width="3" height="6.5" rx="0.6"/><rect x="9" y="3" width="3" height="9" rx="0.6"/><rect x="13.5" y="0" width="3" height="12" rx="0.6"/></svg>
                  <svg class="hcp-wifi-svg" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 9.6a1.35 1.35 0 1 1 0 2.7 1.35 1.35 0 0 1 0-2.7Zm0-3.55c1.7 0 3.25.62 4.45 1.65l-1.15 1.2A4.55 4.55 0 0 0 8 7.55c-1.2 0-2.3.42-3.2 1.12L3.65 7.5A6.7 6.7 0 0 1 8 6.05Zm0-3.5c2.7 0 5.15 1 7.05 2.65L13.9 6.4A8.85 8.85 0 0 0 8 4.05c-2.2 0-4.2.75-5.85 2.05L.95 4.9A11.3 11.3 0 0 1 8 2.55Z"/></svg>
                  <svg class="hcp-battery-svg" viewBox="0 0 27 13" aria-hidden="true"><rect x="0.6" y="0.6" width="22" height="11.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2.2" y="2.3" width="16.5" height="8.4" rx="1.3"/><path d="M24.2 4.2h1.1c.9 0 1.5.6 1.5 1.4v1.8c0 .8-.6 1.4-1.5 1.4h-1.1V4.2Z" opacity="0.4"/></svg>
                </span>
              </div>
              <div class="hcp-lock">
                <p class="hcp-date">Friday 21</p>
                <p class="hcp-clock">9:41</p>
              </div>
              <div class="hcp-stack">
                <div class="hcp-item">
                  <span class="hcp-icon-wrap" aria-hidden="true">
                    <img
                      class="hcp-icon"
                      src="/images/logos/logo-mark-blue-clear-300x300.png"
                      alt=""
                      width="300"
                      height="300"
                      decoding="async"
                    >
                  </span>
                  <div class="hcp-text">
                    <div class="hcp-row">
                      <span class="hcp-app">Shroffin</span>
                      <span class="hcp-time-ago">now</span>
                    </div>
                    <span class="hcp-line">Home loan comparison updated</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/shroffin-home-calm-phone.js?v=17"></script>
</body>
</html>
