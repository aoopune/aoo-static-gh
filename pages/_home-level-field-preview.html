  <title>Zero bias bank field preview — Shroffin</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/shroffin-home-level-field.css?v=16">
  <style>
    html, body { margin: 0; min-height: 100%; background: #1a1a1a; font-family: "Google Sans Flex", -apple-system, BlinkMacSystemFont, sans-serif; }
    .preview {
      box-sizing: border-box;
      width: min(1240px, calc(100% - 48px));
      height: min(620px, calc(100svh - 48px));
      margin: 24px auto;
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
      border-radius: 16px;
      overflow: hidden;
      background: #0a0a0a;
    }
    .preview-copy {
      display: flex; flex-direction: column; justify-content: center;
      padding: 48px; color: rgba(255,255,255,0.55); font-size: 1.2rem; line-height: 1.4;
    }
    .preview-copy strong {
      display: block; margin-bottom: 12px; color: #f5f5f7;
      font-size: 1.75rem; font-weight: 500; letter-spacing: -0.035em;
    }
    @media (max-width: 833px) {
      .preview { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); height: min(760px, calc(100svh - 32px)); }
      .preview-copy { padding: 24px 16px 12px; text-align: center; font-size: 1rem; }
      .preview-copy strong { font-size: 1.2rem; }
    }
  </style>
</head>
