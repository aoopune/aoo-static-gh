<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="public, max-age=300">
  <title>Loan comparison table</title>
  <link rel="icon" href="favicon.ico?v=6" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/logos/favicon-32.png?v=6">
  <link rel="icon" type="image/png" sizes="16x16" href="images/logos/favicon-16.png?v=6">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">
  <link rel="manifest" href="site.webmanifest?v=6">
<!-- No site CSS – only the table script's CSS runs, so layout matches table app exactly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"></noscript>
  <style>
    * { box-sizing: border-box; }
    /* Lock page height, no scroll – only table scrolls internally */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: 'Montserrat', sans-serif;
    }
    /* Full-height flex layout: root → wrap → query (shrink 0) + results (flex 1, scroll) */
    #loan-table-root {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: transparent !important;
    }
    #loan-table-root .aoo-loan-table-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: transparent !important;
    }
    #loan-table-root .wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-bottom: 0 !important;
      padding-bottom: 0 !important;
      background: transparent !important;
    }
    /* Header / filter section – natural height */
    #loan-table-root .query-card {
      flex-shrink: 0;
      margin-bottom: 0.5rem !important;
      padding-bottom: 0.5rem !important;
    }
    /* Table section – takes all remaining space */
    #loan-table-root .results-card {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #loan-table-root .table-wrap {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    /* Table scroll container – only this scrolls */
    #loan-table-root .table-scroll-inner {
      height: 100%;
      max-height: none !important;
      overflow-y: auto;
      overflow-x: auto;
    }

    /* Hide Submit button – table runs on input change; keep count only */
    #loan-table-root .aoo-loan-table-wrap .field.submit-field .btn,
    #loan-table-root .aoo-loan-table-wrap .field.submit-field button[type="submit"] {
      display: none !important;
    }
    /* Force "54 offers..." line centered (overrides component's text-align: right) at all viewports */
    #loan-table-root .aoo-loan-table-wrap .query-card .field.submit-field .count {
      text-align: center !important;
      display: block !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    #loan-table-root .aoo-loan-table-wrap .field input:not([type="radio"]),
    #loan-table-root .aoo-loan-table-wrap .field select {
      font: inherit;
      font-family: 'Montserrat', system-ui, sans-serif;
      font-size: 0.8rem;
    }
    #loan-table-root .aoo-loan-table-wrap .choice-option span {
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      line-height: 1;
      margin: 0;
      color: var(--muted);
    }
    #loan-table-root .aoo-loan-table-wrap .choice-group {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0;
      box-sizing: border-box;
      display: flex !important;
      gap: 2px !important;
      padding: 1px !important;
      min-height: 40px;
      align-items: center;
    }
    /* Desktop: 6 equal columns so inputs fill full width with equal gaps; count on row 2 centered */
    @media (min-width: 768px) {
      #loan-table-root .aoo-loan-table-wrap .query-card .form-row {
        display: grid !important;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: auto auto;
        grid-auto-flow: row;
        column-gap: 1.25rem;
        row-gap: 0.35rem;
        align-items: end;
        width: 100%;
      }
      #loan-table-root .aoo-loan-table-wrap .query-card .form-row .field:nth-child(1),
      #loan-table-root .aoo-loan-table-wrap .query-card .form-row .field:nth-child(2),
      #loan-table-root .aoo-loan-table-wrap .query-card .form-row .field:nth-child(3),
      #loan-table-root .aoo-loan-table-wrap .query-card .form-row .field:nth-child(4),
      #loan-table-root .aoo-loan-table-wrap .query-card .form-row .field:nth-child(5),
      #loan-table-root .aoo-loan-table-wrap .query-card .form-row .field:nth-child(6) {
        grid-row: 1 !important;
      }
      #loan-table-root .aoo-loan-table-wrap .query-card .field.submit-field {
        grid-column: 1 / -1 !important;
        grid-row: 2 !important;
        display: block !important;
        text-align: center !important;
        margin-top: 0.15rem !important;
        width: 100% !important;
        justify-content: center !important;
      }
      #loan-table-root .aoo-loan-table-wrap .query-card .field.submit-field .count {
        display: block !important;
        text-align: center !important;
        margin: 0 auto !important;
      }
    }

    /* Mobile only: input section wider; table keeps its own spacing so columns stay clear. Desktop unchanged. */
    @media (max-width: 767px) {
      body { padding-left: env(safe-area-inset-left, 0); padding-right: env(safe-area-inset-right, 0); }
      /* Root padding kept for table area – columns don't hide */
      #loan-table-root {
        width: 100%;
        max-width: 100%;
        padding-left: 0.75rem;
        padding-right: 0.75rem;
        overflow-x: hidden;
      }
      #loan-table-root .aoo-loan-table-wrap {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      #loan-table-root .wrap {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 0.25rem 0;
        display: flex;
        flex-direction: column;
        align-items: stretch;
      }
      /* Input section only: stretch wider via negative margin (table below keeps root padding) */
      #loan-table-root .query-card {
        width: calc(100% + 1.5rem) !important;
        max-width: none;
        min-width: 0;
        margin-left: -0.75rem;
        margin-right: -0.75rem;
        padding: 0.4rem 0.5rem;
        overflow: visible;
        box-sizing: border-box;
      }
      /* 2-column grid, equal columns, tight gap */
      #loan-table-root .aoo-loan-table-wrap .form-row {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto auto auto;
        grid-auto-flow: column;
        gap: 4px;
        align-items: start;
        min-width: 0;
        width: 100%;
      }
      #loan-table-root .aoo-loan-table-wrap .form-row .field:nth-child(1) { grid-column: 1; grid-row: 1; min-width: 0; }
      #loan-table-root .aoo-loan-table-wrap .form-row .field:nth-child(2) { grid-column: 1; grid-row: 2; min-width: 0; }
      #loan-table-root .aoo-loan-table-wrap .form-row .field:nth-child(3) { grid-column: 1; grid-row: 3; min-width: 0; }
      #loan-table-root .aoo-loan-table-wrap .form-row .field:nth-child(4) { grid-column: 2; grid-row: 1; min-width: 0; }
      #loan-table-root .aoo-loan-table-wrap .form-row .field:nth-child(5) { grid-column: 2; grid-row: 2; min-width: 0; }
      #loan-table-root .aoo-loan-table-wrap .form-row .field:nth-child(6) { grid-column: 2; grid-row: 3; min-width: 0; }
      /* Label on top, input below; 6–8px vertical spacing; labels 12–13px, font-weight 500, reduced letter-spacing */
      #loan-table-root .aoo-loan-table-wrap .form-row .field {
        display: flex !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 6px;
        min-width: 0;
        overflow: visible;
      }
      #loan-table-root .aoo-loan-table-wrap .form-row .field label {
        font-size: 13px !important;
        font-weight: 500 !important;
        letter-spacing: normal;
        text-align: left;
        line-height: 0.8;
      }
      #loan-table-root .aoo-loan-table-wrap .form-row .field > label { justify-content: flex-start; }
      /* Loan amount: keep full-size input bar */
      #loan-table-root .aoo-loan-table-wrap .form-row .field input#amount {
        width: 90% !important;
        max-width: 90% !important;
        box-sizing: border-box;
        padding: 6px 10px !important;
        min-height: 40px;
        height: 40px;
      }
      /* Other input bars (Country, University, Level): slightly smaller */
      #loan-table-root .aoo-loan-table-wrap .form-row .field .combo input {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box;
        padding: 5px 8px !important;
        min-height: 34px !important;
        height: 34px !important;
      }
      /* Toggle buttons (Secured/Unsecured, Gender): full-width in cell, flex with gap */
      #loan-table-root .aoo-loan-table-wrap .form-row .field .choice-group {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0;
        box-sizing: border-box;
        display: flex !important;
        gap: 2px !important;
        padding: 1px !important;
        min-height: 40px;
        align-items: center;
      }
      #loan-table-root .aoo-loan-table-wrap .form-row .field .choice-group .choice-option {
        flex: 1 1 0;
        min-width: 0;
        justify-content: center;
      }
      #loan-table-root .aoo-loan-table-wrap .form-row .field .combo {
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }
      /* Strict row alignment: same baseline for Loan amount & University, etc. */
      #loan-table-root .aoo-loan-table-wrap .form-row .field:nth-child(2),
      #loan-table-root .aoo-loan-table-wrap .form-row .field:nth-child(5) {
        align-items: stretch;
      }
      #loan-table-root .aoo-loan-table-wrap .field.submit-field {
        grid-column: 1 / -1;
        grid-row: 4;
        justify-self: center;
        align-self: start;
        align-items: center;
        text-align: center;
      }
      /* Offers line: tight gap above, center, slightly secondary (opacity) */
      #loan-table-root .aoo-loan-table-wrap .field.submit-field .count {
        display: block;
        text-align: center;
        margin-top: 4px;
        opacity: 0.88;
        font-size: 0.9rem;
      }
    }

    /* Desktop only: 70% width for amount (mobile uses 90% from the rule above) */
    @media (min-width: 768px) {
      #loan-table-root .aoo-loan-table-wrap #amount {
        width: 70% !important;
        max-width: 70% !important;
        box-sizing: border-box;
      }
    }
    #loan-table-root .aoo-loan-table-wrap .choice-group {
      width: 100% !important;
      max-width: 100% !important;
    }
    /* Lender name as link: blue, underline on hover */
    #loan-table-root .aoo-loan-table-wrap .lender-name.view-details-trigger {
      color: #2563eb;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
    }
    #loan-table-root .aoo-loan-table-wrap .lender-name.view-details-trigger:hover {
      color: #1d4ed8;
      text-decoration: underline;
    }
    /* Narrower Lender and Sector columns (all viewports) */
    #loan-table-root .aoo-loan-table-wrap .table-wrap {
      --sticky-col1-width: 11ch;
      --sticky-col2-width: 7ch;
    }

    /* Mobile only: whole iframe content scrolls – input section scrolls away, table can fill the screen */
    @media (max-width: 767px) {
      html, body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #loan-table-root {
        height: auto;
        min-height: 0;
        overflow: visible;
      }
      #loan-table-root .aoo-loan-table-wrap {
        flex: none;
        min-height: 0;
      }
      #loan-table-root .wrap {
        flex: none;
        height: auto;
        min-height: 0;
        overflow: visible;
      }
      #loan-table-root .query-card {
        flex-shrink: 0;
      }
      #loan-table-root .results-card {
        flex: none;
        min-height: 75vh;
        overflow: visible;
      }
      #loan-table-root .table-wrap {
        min-height: 0;
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
      }
      #loan-table-root .table-scroll-inner {
        height: auto;
        min-height: 70vh;
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
      }
      /* Apply & Download: in-flow below form so visible on landing and scroll with page */
      #apply-download-buttons {
        position: relative !important;
        bottom: auto !important;
        right: auto !important;
        margin: 12px 0 16px !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        display: flex !important;
        flex-direction: row !important;
        justify-content: center !important;
        gap: 12px !important;
      }
      /* View Details panel: fully visible and scrollable on mobile so content and Close are reachable */
      .aoo-loan-table-portal .listed-popup-backdrop {
        align-items: flex-start !important;
        padding: 0.5rem !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
        min-height: 100vh !important;
      }
      .aoo-loan-table-portal .listed-popup {
        max-height: 92vh !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 1.5rem !important;
      }
    }
  </style>
</head>
<body>
  <div id="loan-table-root"></div>
  <style id="table-embed-loading-style">
    #loan-table-root .aoo-loading-overlay { position: absolute; inset: 0; background: rgba(248,250,252,0.9); display: flex; align-items: center; justify-content: center; z-index: 10; }
    #loan-table-root .aoo-loading-spinner,
    .aoo-loan-table-portal .aoo-loading-spinner { width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #0d9488; border-radius: 50%; animation: aoo-spin 0.8s linear infinite; }
    .aoo-loan-table-portal .listed-popup-loading { display: flex; align-items: center; justify-content: center; padding: 2rem; min-height: 120px; }
    @keyframes aoo-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function() {
      var TABLE_SCRIPT_URL = 'js/aoo-loan-table-standalone.js?v=7';
      var APPLY_BUTTON_SCRIPT_URL = 'js/apply-button-iframe.js?v=6';
      function showLoading() {
        var root = document.getElementById('loan-table-root');
        if (root && !root.querySelector('.aoo-loading-overlay')) {
          root.innerHTML = '<div class="aoo-loading-overlay" aria-label="Loading"><div class="aoo-loading-spinner"></div></div>';
        }
      }
      function showError(msg) {
        var root = document.getElementById('loan-table-root');
        if (root) root.innerHTML = '<p style="color:#b91c1c;padding:1rem;margin:0;font-weight:600;">' + msg + '</p>';
      }
      function loadApplyButtonScript() {
        var s = document.createElement('script');
        s.src = APPLY_BUTTON_SCRIPT_URL;
        s.setAttribute('data-cfasync', 'false');
        document.head.appendChild(s);
      }
      function runMount() {
        var root = document.getElementById('loan-table-root');
        if (!root) return;
        if (typeof window.AooLoanTable === 'undefined') {
          showError('Table script did not load.');
          return;
        }
        if (window.AooLoanTable._loadError) {
          showError('Table error: ' + (window.AooLoanTable._loadError.message || ''));
          return;
        }
        if (typeof window.AooLoanTable.mount !== 'function') {
          showError('Table script did not load.');
          return;
        }
        try {
          root.innerHTML = '';
          window.AooLoanTable.mount('#loan-table-root');
          loadApplyButtonScript();
        } catch (e) {
          showError('Table error: ' + (e && e.message ? e.message : String(e)));
        }
      }
      function scheduleMount() {
        if (typeof requestIdleCallback !== 'undefined') {
          requestIdleCallback(runMount, { timeout: 300 });
        } else {
          setTimeout(runMount, 0);
        }
      }
      function loadTableScript() {
        var s = document.createElement('script');
        s.src = TABLE_SCRIPT_URL;
        s.setAttribute('data-cfasync', 'false');
        s.onload = scheduleMount;
        s.onerror = function() { showError('Table script did not load.'); };
        document.head.appendChild(s);
      }
      function whenIdle() {
        showLoading();
        if (typeof requestIdleCallback !== 'undefined') {
          requestIdleCallback(loadTableScript, { timeout: 600 });
        } else {
          setTimeout(loadTableScript, 0);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', whenIdle);
      } else {
        whenIdle();
      }
    })();
  </script>
</body>
</html>
