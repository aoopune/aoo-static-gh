                <fieldset class="hlc-filter-group">
                  <legend class="hlc-filter-legend" id="spd-bank-type-label">Bank type</legend>
                  <div class="hlc-filter-checks" role="group" aria-labelledby="spd-bank-type-label">
                    <label class="hlc-filter-option">
                      <input type="checkbox" data-spd-filter="Public" data-spd-default-pressed="true" checked tabindex="-1" />
                      <span class="hlc-filter-option-label">
                        <span class="hlc-filter-option-title">Public</span>
                        <span class="hlc-filter-option-note">Slower process, usually a better rate.</span>
                      </span>
                    </label>
                    <label class="hlc-filter-option">
                      <input type="checkbox" data-spd-filter="Private" data-spd-default-pressed="true" checked tabindex="-1" />
                      <span class="hlc-filter-option-label">
                        <span class="hlc-filter-option-title">Private</span>
                        <span class="hlc-filter-option-note">Smoother process, usually a higher rate and fee.</span>
                      </span>
                    </label>
                  </div>
                </fieldset>

                <fieldset class="hlc-filter-group">
                  <legend class="hlc-filter-legend" id="spd-rate-label">Rate</legend>
                  <div class="hlc-filter-checks" role="group" aria-labelledby="spd-rate-label">
                    <label class="hlc-filter-option">
                      <input type="checkbox" data-spd-filter="Floating" data-spd-default-pressed="true" checked tabindex="-1" />
                      <span class="hlc-filter-option-label">
                        <span class="hlc-filter-option-title">Floating</span>
                        <span class="hlc-filter-option-note">Can move with the benchmark.</span>
                      </span>
                    </label>
                    <label class="hlc-filter-option">
                      <input type="checkbox" data-spd-filter="Fixed" data-spd-default-pressed="false" tabindex="-1" />
                      <span class="hlc-filter-option-label">
                        <span class="hlc-filter-option-title">Fixed</span>
                        <span class="hlc-filter-option-note">Does not change for a few years (generally 5 years). About 1–2% higher than floating rate.</span>
                      </span>
                    </label>
                  </div>
                </fieldset>

                <fieldset class="hlc-filter-group">
                  <legend class="hlc-filter-legend" id="spd-facility-label">Facility</legend>
                  <div class="hlc-filter-checks" role="group" aria-labelledby="spd-facility-label">
                    <label class="hlc-filter-option">
                      <input type="checkbox" data-spd-filter="Term" data-spd-default-pressed="true" checked tabindex="-1" />
                      <span class="hlc-filter-option-label">
                        <span class="hlc-filter-option-title">Term loan</span>
                        <span class="hlc-filter-option-note">A general home loan product.</span>
                      </span>
                    </label>
                    <label class="hlc-filter-option">
                      <input type="checkbox" data-spd-filter="OD" data-spd-default-pressed="false" tabindex="-1" />
                      <span class="hlc-filter-option-label">
                        <span class="hlc-filter-option-title">Overdraft</span>
                        <span class="hlc-filter-option-note">Idle money saves interest. About 0.15–1% higher than term loan</span>
                      </span>
                    </label>
                  </div>
                </fieldset>
